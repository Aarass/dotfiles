set -ag terminal-overrides ",$TERM:RGB"

set -sg escape-time 0

set -g mouse on
set -g base-index 1
set -g renumber-windows on

unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

bind Space last-window

# set-option -g status off
# bind f set status

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'

bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

#sylvan franklin style
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=default'
setw -g window-status-current-format ' #I: #W '
setw -g window-status-style 'fg=#555555'
setw -g window-status-current-style 'fg=red'
setw -g window-status-bell-style 'fg=white'
set -g status-right ''
set -g status-left ''
set -g status-right-length 0
set -g status-left-length 0
set -g message-style 'bg=default, fg=red'
set -g message-command-style 'bg=default, fg=white'


